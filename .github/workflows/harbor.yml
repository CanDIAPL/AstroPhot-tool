# Save this file as .github/workflows/harbor.yml in CanDIAPL/AstroPhot-tool.
# Adapted from canfar-comet/app.py::_build_docker_workflow_yaml, with the same
# six HARBOR_* secret names. This publishes a container image; it does not
# start a CANFAR session, run a science job, or publish the Python package.
# Keep any PyPI workflow as a separate workflow in the same repository.
name: Build, test and publish the AstroPhot-tool docker image

# One job in three stages: build the image, test it, publish it to Harbor.
#   - pull request to main: build and test only
#   - manual run from a branch: build and test only
#   - manual run from main, or a published release: build, test and publish
# The image that is published is the same one that was just tested.
on:
  pull_request: {branches: [main]}
  release: {types: [published]}
  workflow_dispatch: # Adds Actions > Run workflow after this file is on main.

permissions:
  contents: read

concurrency:
  group: harbor-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  tests:
    # A pull request already runs the full test matrix in tests.yml.
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      # Same action versions as tests.yml. Pin reviewed action commit SHAs if
      # your repository requires immutable action versions.
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12' # Keep this aligned with the Dockerfile.

      - name: Install the package and its test dependencies
        run: |
          set -euo pipefail
          # One install, so the torch version is the one pinned in
          # pyproject.toml. The extra index supplies its CPU only build
          # (same line as tests.yml and the Dockerfile).
          python -m pip install '.[dev]' --extra-index-url https://download.pytorch.org/whl/cpu

      - name: Run the existing AstroPhot-tool tests
        env:
          MPLBACKEND: Agg
          OMP_NUM_THREADS: '2'
          MKL_NUM_THREADS: '2'
        run: python -m pytest -q

  image:
    needs: tests
    # Runs when the tests passed, or were skipped (pull request).
    if: ${{ !cancelled() && needs.tests.result != 'failure' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # Name of the image on this runner, for the build and test stages.
      LOCAL_IMAGE: astrophot-tool:ci
      # Whether the publish stage runs. A published release always publishes
      # (its ref is refs/tags/<tag>, not main). A manual run publishes only
      # from main, which protects the shared tag from a feature-branch run.
      PUBLISH: ${{ github.event_name == 'release' || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') }}

    steps:
      - uses: actions/checkout@v7

      ########################################################################
      # Build
      ########################################################################
      - name: Build the headless docker image
        run: |
          set -euo pipefail
          # The final '.' is the build context: this repository's root.
          # For another layout use: --file path/to/Dockerfile path/to/context
          # linux/amd64 is the starter target; ARM/multi-platform builds need
          # a tested Buildx/QEMU setup and matching scientific dependencies.
          docker build --pull --platform linux/amd64 \
            --label "org.opencontainers.image.revision=$GITHUB_SHA" \
            --label "org.opencontainers.image.source=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" \
            --tag "$LOCAL_IMAGE" .
          docker image ls "$LOCAL_IMAGE"

      ########################################################################
      # Test
      ########################################################################
      - name: Check the container interface
        run: |
          set -euo pipefail
          # No arguments: prints the usage text and exits
          docker run --rm "$LOCAL_IMAGE"
          docker run --rm --entrypoint python "$LOCAL_IMAGE" \
            -c 'from AstroPhot_tool import joint_multi_image; print("AstroPhot import OK")'

      - name: Run a fit inside the container
        run: |
          set -euo pipefail
          # A scratch directory shared with the container. The container runs
          # as its own user (10001), which must be able to write here.
          mkdir -p smoke/input
          chmod -R a+rwx smoke
          # Write the fake three-image dataset of the unit tests as FITS files
          # plus a config.json, using the Python environment of the image.
          docker run --rm --volume "$PWD/tests:/tests:ro" --volume "$PWD/smoke:/work" \
            --entrypoint python "$LOCAL_IMAGE" /tests/fake_data.py /work/input
          # The real thing: the image's own entrypoint, as a job would run it.
          docker run --rm --volume "$PWD/smoke:/work" "$LOCAL_IMAGE" \
            --config /work/input/config.json --output-dir /work/output
          # The fit converged on the known answer
          jq -e '(.message | test("success")) and (.chi2_ndf > 0.97) and (.chi2_ndf < 1.03)' \
            smoke/output/results.json
          jq '{message, chi2_ndf, iterations}' smoke/output/results.json

      ########################################################################
      # Publish (skipped for pull requests and feature branches)
      ########################################################################
      - name: Check configuration and construct image names
        if: env.PUBLISH == 'true'
        env:
          # Settings > Secrets and variables > Actions > Repository secrets.
          # COMET can populate these. A manual setup uses the same names:
          HARBOR_URL: ${{ secrets.HARBOR_URL }} # images.canfar.net (no https:// or /)
          HARBOR_PROJECT: ${{ secrets.HARBOR_PROJECT }} # e.g. candiapl
          HARBOR_REPOSITORY: ${{ secrets.HARBOR_REPOSITORY }} # e.g. astrophot-tool
          # The moving tag, overwritten by every publish: e.g. main or latest.
          HARBOR_IMAGE_TAG: ${{ secrets.HARBOR_IMAGE_TAG }}
          # The release's own tag (e.g. v0.1.0), empty for a manual run.
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          # Only checked for presence here, used by the log in step.
          HARBOR_USERNAME: ${{ secrets.HARBOR_USERNAME }}
          HARBOR_PASSWORD: ${{ secrets.HARBOR_PASSWORD }}
        run: |
          set -euo pipefail
          for key in HARBOR_URL HARBOR_PROJECT HARBOR_REPOSITORY HARBOR_IMAGE_TAG HARBOR_USERNAME HARBOR_PASSWORD; do
            if [[ -z "${!key}" ]]; then
              echo "::error::Missing Actions secret: $key"
              exit 1
            fi
          done
          # Validate public reference components without printing secret values.
          [[ "$HARBOR_URL" =~ ^[a-z0-9.-]+(:[0-9]+)?$ ]] || { echo '::error::HARBOR_URL must be a registry host, optionally with a port'; exit 1; }
          [[ "$HARBOR_PROJECT" =~ ^[a-z0-9]+([._-][a-z0-9]+)*$ ]] || { echo '::error::Use a lowercase Harbor project name'; exit 1; }
          [[ "$HARBOR_REPOSITORY" =~ ^[a-z0-9]+([._-][a-z0-9]+)*$ ]] || { echo '::error::Use one lowercase image repository name'; exit 1; }
          [[ "$HARBOR_IMAGE_TAG" =~ ^[a-zA-Z0-9_][a-zA-Z0-9_.-]{0,127}$ ]] || { echo '::error::Invalid image tag'; exit 1; }
          image="$HARBOR_URL/$HARBOR_PROJECT/$HARBOR_REPOSITORY"
          printf 'HARBOR_HOST=%s\n' "$HARBOR_URL" >> "$GITHUB_ENV"
          printf 'IMAGE_REF=%s:%s\n' "$image" "$HARBOR_IMAGE_TAG" >> "$GITHUB_ENV"
          printf 'COMMIT_REF=%s:sha-%s\n' "$image" "$GITHUB_SHA" >> "$GITHUB_ENV"
          # A release is also published under its own name, so each release
          # keeps an image of its own when the moving tag moves on.
          if [[ -n "$RELEASE_TAG" ]]; then
            [[ "$RELEASE_TAG" =~ ^[a-zA-Z0-9_][a-zA-Z0-9_.-]{0,127}$ ]] || { echo '::error::The release tag is not a valid image tag'; exit 1; }
            printf 'RELEASE_REF=%s:%s\n' "$image" "$RELEASE_TAG" >> "$GITHUB_ENV"
          fi

      - name: Log in to Harbor
        if: env.PUBLISH == 'true'
        env:
          # Username + Harbor CLI secret, OR a project robot account + its token.
          # A CADC browser-login password is not the Harbor CLI secret.
          HARBOR_USERNAME: ${{ secrets.HARBOR_USERNAME }}
          HARBOR_PASSWORD: ${{ secrets.HARBOR_PASSWORD }}
        run: |
          set -euo pipefail
          printf '%s' "$HARBOR_PASSWORD" | docker login "$HARBOR_HOST" \
            --username "$HARBOR_USERNAME" --password-stdin

      - name: Push the tested image to Harbor
        if: env.PUBLISH == 'true'
        run: |
          set -euo pipefail
          # The SHA tag makes the source revision explicit. Tags are still
          # mutable unless Harbor protects them; use the image digest for a
          # particular science run and save that digest alongside its config.
          for ref in "$COMMIT_REF" ${RELEASE_REF:+"$RELEASE_REF"} "$IMAGE_REF"; do
            docker tag "$LOCAL_IMAGE" "$ref"
            docker push "$ref"
          done

      - name: Log out of Harbor
        if: always() && env.PUBLISH == 'true' && env.HARBOR_HOST != ''
        run: docker logout "$HARBOR_HOST"

# Optional changes:
# - Multiple images: copy the image job or use a matrix of Dockerfile/context
#   and Harbor repository values. Each logical science step can have its own
#   image; it need not have its own GitHub repository.
# - Build caching: switch build/push to docker/setup-buildx-action and
#   docker/build-push-action when the basic workflow is working.
# - Harbor visibility: after publishing, apply the 'headless' artifact label
#   in Harbor if the image should appear in CANFAR's headless image listing.
#   A Dockerfile LABEL is not a substitute for that Harbor registry label.
