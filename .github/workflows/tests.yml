name: Tests

on:
  pull_request:
  schedule:
    # 06:17 UTC on the 1st of every month, runs on the default branch (main)
    - cron: "17 6 1 * *"
  workflow_dispatch: # allows a manual run from the Actions tab

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pytest:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        # AstroPhot 0.18 requires Python >= 3.11
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install
        # The extra index provides the CPU only build of the pinned torch
        # version, which avoids downloading the CUDA libraries.
        run: python -m pip install ".[dev]" --extra-index-url https://download.pytorch.org/whl/cpu

      - name: Test
        run: python -m pytest
